# Scrib: one Cargo workspace for the framework (`superfargoth/`) and the game (`bevyrrowind/`).
# One Cargo.lock, one `[patch.crates-io]`, one target dir. Commands work from any subfolder (cargo walks up).
[workspace]
resolver = "3"
members = ["superfargoth/crates/*", "bevyrrowind/crates/*", "bevyrrowind/apps/*"]
# `superfargoth/vendor`: patched third-party crates (`[patch.crates-io]` below), not ours to lint or test.
# `superfargoth/plugins`: the NVIDIA-linking DLSS plugin (`plugins/sf_dlss`) is its own workspace, shipped apart.
exclude = ["superfargoth/vendor", "superfargoth/plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/TODO/scrib"

[workspace.dependencies]
# Bevy sub-crates: libraries take only what they use (superfargoth ARCHITECTURE §8b rule 6).
bevy_app = { version = "0.20", default-features = false }
bevy_asset = { version = "0.20", default-features = false }
bevy_diagnostic = { version = "0.20", default-features = false }
bevy_ecs = { version = "0.20", default-features = false }
bevy_log = { version = "0.20", default-features = false }
bevy_audio = { version = "0.20", default-features = false }
bevy_mesh = { version = "0.20", default-features = false }
bevy_platform = { version = "0.20", default-features = false }
bevy_reflect = { version = "0.20", default-features = false }
bevy_time = { version = "0.20", default-features = false }
bevy_transform = { version = "0.20", default-features = false }
# Rendering sub-crates (sf_sky_bevy). `bevy_solari` is optional there (`solari` feature).
# `bevy_anti_alias` is optional there too (`dlss` feature: DLSS Ray Reconstruction).
bevy_anti_alias = { version = "0.20", default-features = false }
bevy_camera = { version = "0.20", default-features = false }
bevy_color = { version = "0.20", default-features = false }
bevy_core_pipeline = { version = "0.20", default-features = false }
bevy_light = { version = "0.20", default-features = false }
bevy_math = { version = "0.20", default-features = false }
bevy_pbr = { version = "0.20", default-features = false }
# `AutoExposure` (mw_environment_bevy render.rs screenshot log).
bevy_post_process = { version = "0.20", default-features = false }
bevy_render = { version = "0.20", default-features = false }
bevy_solari = { version = "0.20", default-features = false }
# Streaming glue (sf_world_bevy). `bevy_gizmos` is optional there (`debug` feature).
bevy_gizmos = { version = "0.20", default-features = false }
bevy_image = { version = "0.20", default-features = false }
bevy_material = { version = "0.20", default-features = false }
bevy_shader = { version = "0.20", default-features = false }
bevy_shape = { version = "0.20", default-features = false }
bevy_tasks = { version = "0.20", default-features = false }
# Game UI glue (sf_ui_bevy): layout, headless widgets' `Activate`, focus and directional navigation.
bevy_input = { version = "0.20", default-features = false }
bevy_input_focus = { version = "0.20", default-features = false }
bevy_ui = { version = "0.20", default-features = false }
bevy_ui_widgets = { version = "0.20", default-features = false }
# Dev console overlay (sf_console_bevy `overlay` feature): one-shot mesh ray for click-select, cursor release.
bevy_picking = { version = "0.20", default-features = false }
bevy_text = { version = "0.20", default-features = false }
bevy_window = { version = "0.20", default-features = false }
# The free camera (`mw_controls_bevy` follows its fly keys to the Jump / Sneak bindings).
bevy_camera_controller = { version = "0.20", default-features = false }
# UI input actions and prioritised, input-consuming contexts (ui.md OQ4, chosen 2026-10-18). Allowed ahead
# of the crate "update all" batch (owner). No `state` feature: we don't drive contexts from bevy_state.
bevy_enhanced_input = { version = "0.27", default-features = false }
# UI styling (sf_ui_css only, ui.md R2b): CSS with cascade layers. Pulls Servo's MPL-2.0 `cssparser`/`selectors`,
# allowed unmodified (owner 2026-10-11); no other crate may depend on it.
bevy_flair = { version = "0.9", default-features = false }
# Full engine. Framework: examples and tools only (dev-dependency), never a library dependency.
# Game: no features here; each crate asks for exactly what it uses, the app picks the full set.
# Unused Bevy features are crates we never compile.
bevy = { version = "0.20", default-features = false }
# Floating-origin grids (world-coordinates.md). RC for Bevy 0.20: pinned until 0.14.0 ships.
big_space = { version = "=0.14.0-rc.0", default-features = false, features = ["std", "i32"] }
bitflags = "2"
# blake3 and glam match what Bevy 0.20 uses (bevy_asset, bevy_math): one copy in the tree.
blake3 = "1.8"
futures-lite = "2"
# UI strings (sf_ui, ui.md "Stack decision" 3): Project Fluent's reference crates, Bevy-free.
fluent-bundle = "0.16"
unic-langid = "0.9"
# sf_vfs hot reload (M5 A4): lock-free snapshot swap; the watcher crate and channel Bevy 0.20 uses.
arc-swap = "1.9"
async-channel = { version = "2", default-features = false }
notify-debouncer-full = "0.7"
# Same version bevy_gltf 0.20 uses. No "import" feature: we never decode images here.
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_materials_unlit"] }
glam = "0.33"
# Dialogue topic hyperlinks (sf_rpg, rpg.md "Topic links"); already in the lock through regex.
aho-corasick = "1.1"
indexmap = "2"
log = "0.4"
lz4_flex = "0.14"
# Same version Bevy 0.20 uses for meshlets (one copy in the tree). Builds meshoptimizer (C++) with cc.
meshopt = "0.6.2"
# Luau runtime (scripting.md R1/R2). Only sf_script depends on it; `send` is an sf_script feature (on by
# default) so the L1 spike can A/B it against `NonSend` storage.
mlua = { version = "0.12.2", default-features = false, features = ["luau"] }
# Collision queries (sf_controller's static query world): the library under avian and rapier.
# Bevy-free; its math types are glam 0.33 (through glamx), the same glam as ours.
parry3d = { version = "0.31.1", default-features = false, features = ["required-features", "std", "alloc"] }
# Rigid-body engine behind the Bevy-free sf_physics (physics.md; ARCHITECTURE §10 2026-10-12). Apache-2.0, no Bevy.
# Same parry3d as above. No `parallel` (rayon) until a measured step needs it; no `enhanced-determinism`.
rapier3d = { version = "0.36.1", default-features = false, features = ["dim3", "f32", "std"] }
# Save/wire format (sf_save) and the game's round-trip tests.
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon = "1.12"
# Same version Bevy 0.20 uses (bevy_asset, bevy_reflect): one copy in the tree. Graph assets (sf_anim_graph).
ron = "0.12"
# CPU twin of the longest wave cascade (sf_water; water.md "The water query").
rustfft = "6.4"
semver = { version = "1", features = ["serde"] }
# Saved-type shape goldens (save.md "Drift guard"); tests only (sf_save_bevy).
serde-reflection = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
# Delaunay triangulation of blend-space samples at bake (sf_anim_graph `bake` feature).
spade = "2.15"
tempfile = "3"
thiserror = "2"
toml = "0.9"
# FBX import at bake time (sf_anim `fbx` feature): bindings to the single-file ufbx C library, built with `cc`.
ufbx = "0.11.5"
# Same version Bevy 0.20 renders with. Dev-dependency only: headless GPU twin tests (sf_wind).
wgpu = { version = "30", default-features = false }

# Game-only third-party crates (bevyrrowind).
# TES3 formats (MIT/Apache). Unstable API: pinned to a commit.
tes3 = { git = "https://github.com/Greatness7/tes3", rev = "e61ad140b51d889ae5aa30914ba2a20fd51bf2e0", default-features = false }
clap = { version = "4", features = ["derive"] }
# Platform data directories: the bake cache lives in the local data dir.
dirs = "6"
encoding_rs = "0.8"
# Seeded RNG for NPC wander rolls (same version Bevy already pulls in).
fastrand = "2.5"
# Pathgrid graphs and A* (same version Bevy already pulls in).
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
winreg = "0.55"

# Framework crates: `version` matches `workspace.package.version` (cargo-deny `wildcards`; crates.io needs it).
sf_action = { path = "superfargoth/crates/sf_action", version = "0.1.0" }
sf_action_bevy = { path = "superfargoth/crates/sf_action_bevy", version = "0.1.0" }
