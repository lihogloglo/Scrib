[patch.crates-io]
# big_space with dirty-tree pruning in low-precision propagation (superfargoth/vendor/big_space,
# "superfargoth patch" comments; superfargoth/docs/research/perf/README.md item 2). Drop once upstream has it.
big_space = { path = "superfargoth/vendor/big_space" }
# Bevy 0.20.0 with bevyengine/bevy PRs #26149 (`Core3dShadows`: a slim schedule for point/spot shadow
# views) and #26161 (skip re-rendering unchanged point/spot shadow maps); superfargoth/vendor/README.md.
# Drop on the Bevy release that ships both.
bevy_core_pipeline = { path = "superfargoth/vendor/bevy_core_pipeline" }
bevy_pbr = { path = "superfargoth/vendor/bevy_pbr" }
bevy_render = { path = "superfargoth/vendor/bevy_render" }
# dlss_wgpu 6.0.0 facade with no NVIDIA code: NGX lives in the separately shipped plugin
# (superfargoth/plugins/sf_dlss), loaded at runtime from <exe>/dlss/; superfargoth/vendor/README.md.
# Keep while the game is GPL.
dlss_wgpu = { path = "superfargoth/vendor/dlss_wgpu" }
# Our feature-unification crate in place of the crates.io stub (`workspace-hack` above).
workspace-hack = { path = "superfargoth/crates/workspace-hack" }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
# Bevy system parameters (`Res<T>`, `Query<..>`) idiomatically elide lifetimes.
elided_lifetimes_in_paths = "allow"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Bevy system parameters (`Res<T>`, `Query<..>`) are taken by value by design.
needless_pass_by_value = "allow"
# Trait impls (e.g. Bevy's AssetReader) read best as `async fn` even when synchronous.
unused_async_trait_impl = "allow"

# Build profiles. See superfargoth/docs/ARCHITECTURE.md "Build performance".
#
# dev: our crates barely optimized (fast to rebuild), dependencies fully
# optimized (built once, and Bevy is unusably slow at opt-level 0). Line
# tables only: readable backtraces, much less to generate and link. Use
# `--profile debugging` when you need a debugger.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Proc macros (Bevy derives, serde) and build scripts run on every build of
# their users; optimized, they expand faster.
[profile.dev.build-override]
opt-level = 3

# Full debug info for stepping through our code in a debugger.
[profile.debugging]
inherits = "dev"
debug = true

# Release with symbols, for Tracy / perf profiling.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# `profiling` plus `--features trace` (per-system CPU spans, bevyrrowind/docs/perf.md). Its own
# profile, so switching between the two never rebuilds the other.
[profile.profiling-trace]
inherits = "profiling"

# Shipping builds: slow to compile, fastest to run.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
