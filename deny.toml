# cargo-deny policy for the Scrib workspace (superfargoth + bevyrrowind): `cargo deny check` from the
# repo root (superfargoth/README.md "Dependency policy").
# Config reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
# Check every crate any feature can pull in (DLSS, Solari, FBX...), not just the defaults.
all-features = true

[advisories]
# RustSec advisory database. Vulnerabilities, unsound and unmaintained crates are errors; yanked
# versions are warnings. Accepting an advisory needs an `ignore` entry with its reason.
version = 2
unmaintained = "all"
yanked = "warn"
ignore = [
    # ruzstd 0.8 decompression bomb (OOM on a tiny input). Bevy 0.20 pins 0.8 (bevy_image `zstd_rust`
    # for KTX2, bevy_anti_alias LUTs); the fix is 0.9.1, so no safe upgrade without a Bevy release.
    # Inputs are local asset files (game data, installed mods): worst case a crash, not code execution.
    # Revisit in the crate "update all" batch.
    { id = "RUSTSEC-2026-0344", reason = "no fix reachable on Bevy 0.20; local asset input only; update batch" },
    # ttf-parser unmaintained, no upgrade: Bevy's accesskit_winit (bevy_winit) pulls it.
    { id = "RUSTSEC-2026-0192", reason = "transitive via bevy_winit/accesskit_winit; no maintained alternative upstream" },
    # paste unmaintained (finished proc macro, no upgrade): pulled by the game's tes3 git dependency.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc macro via tes3; no replacement upstream" },
]

[licenses]
version = 2
# Ours is GPL-3.0-or-later (CLAUDE.md hard rule 8, owner 2026-10-25): GPL-3.0-compatible licences
# only. GPL-2.0-only (incompatible) and AGPL (network clause) are never listed.
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    # Public-domain-like, no attribution needed (owner decision 2026-10-22): encase (Bevy), notify.
    "MIT-0",
    "CC0-1.0",
]
confidence-threshold = 0.93
# MPL-2.0 is allowed only for unmodified crates.io dependencies (owner decision 2026-10-11), and only
# for the crates named here, all pulled in by `bevy_flair` (sf_ui_css). A new MPL crate fails the check
# until it is reviewed and added. Never patch or vendor these (`[patch.crates-io]`, vendor/).
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-color", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    # The game (bevyrrowind app): `dirs` (bake cache dir) pulls option-ext through dirs-sys, and the
    # Bevy `mp3` feature pulls Symphonia's MP3 decoder. Unmodified crates.io deps, same rule as above.
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "symphonia", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-mp3", allow = ["MPL-2.0"] },
    { crate = "symphonia-core", allow = ["MPL-2.0"] },
    { crate = "symphonia-metadata", allow = ["MPL-2.0"] },
]

# The tes3 root package doesn't inherit its workspace's `license = "MIT OR Apache-2.0"` (its sub-crates
# do); its LICENSE file is MIT.
[[licenses.clarify]]
crate = "tes3"
expression = "MIT OR Apache-2.0"
license-files = []

[licenses.private]
# Our own crates are unpublished workspace members; their licence is the workspace's.
ignore = true

[bans]
# Two versions of one crate cost compile time (ARCHITECTURE §8b). Warn on every duplicate, Bevy's
# above all; the summary names them. Errors would block on transitive platform crates we don't control.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies (our workspace and vendor/ patches) are not wildcards. cargo-deny allows them only in
# unpublished crates: the game's crates are `publish = false` (GPL game, git dependency); framework
# crates give `version` with each path instead.
allow-wildcard-paths = true
highlight = "all"

[sources]
# crates.io only. A git dependency must be listed here on purpose.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # TES3 formats (MIT OR Apache-2.0), the game's only git dependency: not on crates.io, pinned to a
    # commit in the root Cargo.toml (unstable API). Covers its sub-crates (bsa, esp, nif, bytes_io...).
    "https://github.com/Greatness7/tes3",
]
