# cargo-hakari settings (https://docs.rs/cargo-hakari/latest/cargo_hakari/config): the
# `workspace-hack` crate pins one feature set per third-party dependency, so `cargo test -p A` and
# `-p B` reuse the same Bevy build instead of each compiling its own variant. superfargoth/CLAUDE.md "Commands".
hakari-package = "workspace-hack"
dep-format-version = "4"
resolver = "3"
# The owner's laptop and the cloud sessions.
platforms = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
# `workspace-hack.workspace = true` lines, like every other dependency here.
workspace-hack-line-style = "workspace-dotted"

[traversal-excludes]
# The game app is never simulated: its opt-in features (`dev` = Bevy dynamic linking + file watcher,
# `dlss`, `solari`, `remote`, `trace`, `tracy`) would otherwise reach every build through the
# `--all-features` simulation. Excluded from traversal, it gets no hack line either; its build still
# gets the hack's features through its library dependencies, plus its own.
workspace-members = ["bevyrrowind"]
# Game-only TES3 format crates (one git repo), with what they alone turn on (glam 0.30, `half/nightly`):
# the hack lives in superfargoth, whose crates never pull Morrowind formats (superfargoth/CLAUDE.md
# hard rule 1). Their users are the Bevy-free mw_* cores, which don't take the hack anyway.
third-party = [
    { name = "tes3", git = "https://github.com/Greatness7/tes3", rev = "e61ad140b51d889ae5aa30914ba2a20fd51bf2e0" },
    { name = "bytes_io", git = "https://github.com/Greatness7/tes3", rev = "e61ad140b51d889ae5aa30914ba2a20fd51bf2e0" },
    { name = "esp", git = "https://github.com/Greatness7/tes3", rev = "e61ad140b51d889ae5aa30914ba2a20fd51bf2e0" },
    { name = "esp_macros", git = "https://github.com/Greatness7/tes3", rev = "e61ad140b51d889ae5aa30914ba2a20fd51bf2e0" },
    { name = "nif", git = "https://github.com/Greatness7/tes3", rev = "e61ad140b51d889ae5aa30914ba2a20fd51bf2e0" },
    # BRP for agents (`mw_devtools_bevy` `remote`, on only through the app's `remote`/`dev`): same reason as the
    # app above; simulated, its HTTP server and `bevy/serialize` would reach every build.
    { name = "bevy_brp_extras" },
    { name = "bevy_remote" },
]

[final-excludes]
# Bevy-free cores (ARCHITECTURE section 8b rule 1) don't depend on the hack: it carries the whole
# Bevy stack, and a core must still build cold in seconds. Their feature needs still count toward
# the hack. A new crate whose graph has no Bevy, even with `--all-features`, goes here; `sf_vfs` is
# here too (Bevy only behind its `bevy` feature).
workspace-members = [
    "sf_action",
    "sf_anim",
    "sf_anim_graph",
    "sf_atmos",
    "sf_audio",
    "sf_bake",
    "sf_camera",
    "sf_character",
    "sf_combat",
    "sf_console",
    "sf_controller",
    "sf_coords",
    "sf_diag",
    "sf_ids",
    "sf_level",
    "sf_lod",
    "sf_model",
    "sf_mods",
    "sf_physics",
    "sf_ragdoll",
    "sf_records",
    "sf_rpg",
    "sf_rpg_ui",
    "sf_save",
    "sf_script",
    "sf_sky",
    "sf_terrain",
    "sf_ui",
    "sf_ui_inventory",
    "sf_water",
    "sf_weather",
    "sf_wind",
    "sf_world",
    "sf_vfs",
    # Game cores (bevyrrowind/crates): all but `mw_assets` (the Bevy asset loaders) are Bevy-free.
    "mw_actors",
    "mw_ai",
    "mw_anim",
    "mw_audio",
    "mw_bake",
    "mw_combat",
    "mw_delirium",
    "mw_graphs",
    "mw_install",
    "mw_mods",
    "mw_nif",
    "mw_physics",
    "mw_records",
    "mw_rpg",
    "mw_script",
    "mw_vfs",
    "mw_water",
    "mw_weather",
    "mw_world",
]
# Unified features would be every crate's `--all-features`, so opt-ins that must not leak into
# default builds stay per crate: DLSS (its build needs the DLSS SDK), the Luau JIT (`sf_script/jit`)
# and rayon-parallel physics (`sf_physics/parallel`: off by spec, physics.md "Determinism"). Cost:
# Bevy crates that don't use physics build their own nalgebra/glamx (one extra variant, no Bevy).
third-party = [
    { name = "bevy_anti_alias" },
    { name = "bevy_solari" },
    { name = "mlua" },
    { name = "mlua-sys" },
    { name = "parry3d" },
    { name = "rapier3d" },
]
