# cargo-hakari settings (https://docs.rs/cargo-hakari/latest/cargo_hakari/config): the
# `workspace-hack` crate pins one feature set per third-party dependency, so `cargo test -p A` and
# `-p B` reuse the same Bevy build instead of each compiling its own variant. CONTRIBUTING.md "Building".
hakari-package = "workspace-hack"
dep-format-version = "4"
resolver = "3"
# The owner's laptop and the cloud sessions.
platforms = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
# `workspace-hack.workspace = true` lines, like every other dependency here.
workspace-hack-line-style = "workspace-dotted"

[traversal-excludes]
# The game app is never simulated: its opt-in features (`dev` = Bevy dynamic linking + file watcher,
# `dlss`, `solari`, `remote`, `trace`, `tracy`) would otherwise reach every build through the
# `--all-features` simulation. Excluded from traversal, it gets no hack line either; its build still
# gets the hack's features through its library dependencies, plus its own.
workspace-members = ["bevyrrowind"]
# The app's default build must add nothing the hack lacks, or `cargo build -p bevyrrowind` compiles its
# own Bevy (build-speed BS1, 2026-11-11): every Bevy feature it needs is asked for by the library crate
# that uses it (audio by mw_exterior_bevy's DefaultPlugins, codecs by mw_audio_bevy, PCSS by
# mw_exterior_bevy), and the app's own lines stay a subset. Check: build-perf.md "Feature unification".
third-party = [
    # BRP for agents (`mw_devtools_bevy` `remote`, on only through the app's `remote`/`dev`): same reason as the
    # app above; simulated, its HTTP server, `bevy/serialize` and `bevy_tasks/async-io` (the executor blocks on
    # async-io's reactor: a shipped hot-path change) would reach every build. So `dev` keeps its own Bevy (BS1b).
    { name = "bevy_brp_extras" },
    { name = "bevy_remote" },
]

[final-excludes]
# Bevy-free cores (ARCHITECTURE section 8b rule 1) don't depend on the hack: it carries the whole
# Bevy stack, and a core must still build cold in seconds. Their feature needs still count toward
# the hack. A new crate whose graph has no Bevy, even with `--all-features`, goes here; `sf_vfs` is
# here too (Bevy only behind its `bevy` feature), as is `sf_ids` (the clock resource).
workspace-members = [
    "sf_action",
    "sf_ai",
    "sf_anim",
    "sf_anim_graph",
    "sf_atmos",
    "sf_audio",
    "sf_bake",
    "sf_camera",
    "sf_character",
    "sf_combat",
    "sf_console",
    "sf_controller",
    "sf_coords",
    "sf_diag",
    "sf_effects",
    "sf_ids",
    "sf_gi",
    "sf_level",
    "sf_lod",
    "sf_model",
    "sf_mods",
    "sf_nav",
    "sf_nav_bake",
    "sf_nav_recast",
    "sf_physics",
    "sf_ragdoll",
    "sf_records",
    "sf_rpg",
    "sf_rpg_ui",
    "sf_save",
    "sf_scene",
    "sf_script",
    "sf_sky",
    "sf_stats",
    "sf_surface",
    "sf_terrain",
    "sf_texture",
    "sf_ui",
    "sf_ui_inventory",
    "sf_video",
    "sf_water",
    "sf_weather",
    "sf_wind",
    "sf_world",
    "sf_vfs",
    # Game cores (bevyrrowind/crates): all but `mw_assets` (the Bevy asset loaders) are Bevy-free.
    "mw_actors",
    "mw_ai",
    "mw_anim",
    "mw_audio",
    "mw_bake",
    "mw_combat",
    "mw_delirium",
    "mw_effects",
    "mw_graphs",
    "mw_install",
    "mw_mods",
    "mw_nif",
    "mw_physics",
    "mw_records",
    "mw_rpg",
    "mw_script",
    "mw_stats",
    "mw_ui",
    "mw_vfs",
    "mw_water",
    "mw_weather",
    "mw_world",
