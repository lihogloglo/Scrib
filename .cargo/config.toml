# Build settings shared by everyone working in this repo.
# See superfargoth/docs/ARCHITECTURE.md "Build performance".

# rust-lld ships with the MSVC toolchain and links several times faster
# than link.exe (Bevy's fast-builds recommendation). Nothing to install.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustdocflags = ["-Clinker=rust-lld.exe"]

[alias]
# Iterate with Bevy dynamically linked: `cargo dev view "Balmora, Guild of Mages"`
dev = "run -p bevyrrowind --features dev --"

# DLSS builds (`--features dlss`): the SDK subset, Vulkan headers and
# libclang live in ../sdk (not in any repo; `bash ../sdk/fetch.sh`).
# Real environment variables win over these.
[env]
DLSS_SDK = { value = "../sdk/dlss", relative = true }
VULKAN_SDK = { value = "../sdk/vulkan", relative = true }
LIBCLANG_PATH = { value = "../sdk/libclang", relative = true }
