# The pre-PR gate (CONTRIBUTING.md "Building") off the owner's laptop (build-speed BS3, 2026-11-26).
# Windows runners: same OS, linker (rust-lld, .cargo/config.toml) and paths as the dev machine, so green here
# means what a green local gate means. Jobs run in parallel (tests in three shards); caches are saved from main
# only (branches restore them; cargo_cache.mjs prunes each to its run's units), which keeps the repo under GitHub's
# 10 GB cache limit.
#
# Agents: `bash bevyrrowind/tools/ci_push.sh <name> <paths>` (or push a wt/** worktree branch, or open a PR)
# instead of running the full gate locally, then
# `gh run watch --interval 120` (never tighter: one shared API quota) / `gh run view --log-failed`. superfargoth/docs/build-perf.md "CI".
name: ci

# Docs-only pushes skip CI (later patterns win; vendored crates embed their README in tests and docs).
on:
  push:
    branches: [main, "ci/**", "wt/**"]
    paths: ["**", "!**/*.md", "!docs/**", "superfargoth/vendor/**"]
  pull_request:
    paths: ["**", "!**/*.md", "!docs/**", "superfargoth/vendor/**"]
  workflow_dispatch:

# ci/wt branches and PRs: one run per branch, a newer push cancels the running one. Main: one group as well, but a
# running run is never cancelled: at most one run in progress plus the newest pending one, so each verdict covers
# the batch of commits pushed while the previous run ran, and a red one lists its suspects since the last green
# ancestor (ci_report.mjs). GitHub shows the pending runs a newer push replaced as cancelled: they never started.
# One group per commit (128d6094) gave every push its own run: 21 main runs were in progress or queued within
# 40 min on 2026-11-26, at the 20-job limit, each saving its own 4 GB of cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ci_report.mjs reads the run list (last green main run) and commit files for its suspect list.
permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info for our crates either: smaller target, faster links. Backtraces still name functions.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  # Three shards by crate group, each on its own runner with its own cache (test_groups.mjs: crates ordered by how
  # many workspace libs they need, cut where the slowest shard is shortest; every crate in exactly one shard, with
  # the features the whole workspace gives it). After a change low in the graph (sf_ids) the slowest shard built in
  # 13 min where one job took 23 (2026-11-26, docs/ledger/build.md). The floor is the shard that holds the app: it
  # compiles every lib.
  test:
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      # LFS clips (tests read them) come from the Actions cache: the free LFS bandwidth is ~1 GB/month.
      - name: LFS object ids
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: LFS pull
        shell: bash
        run: git lfs pull
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install || rustup show
      # Whole-target cache per shard (cargo_cache.mjs says why not Swatinem/rust-cache). Saved from main only, and
      # only by a run that compiled something; every branch restores the newest main entry of its shard. Why each
      # unit rebuilt, when a run is slower than its change explains: set
      # CARGO_LOG=cargo::core::compiler::fingerprint=info on the build step.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-v2-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-s${{ matrix.shard }}of3-${{ github.sha }}
          restore-keys: test-v2-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-s${{ matrix.shard }}of3-
      - name: Unchanged sources get an old mtime (cargo freshness)
        shell: bash
        run: node .github/workflows/cargo_cache.mjs mtimes
      # After the cache: cargo metadata reads the registry crates the cache brings back.
      - name: Crates of this shard
        shell: bash
        run: |
          node .github/workflows/test_groups.mjs 3
          echo "SHARD=$(node .github/workflows/test_groups.mjs 3 ${{ matrix.shard }})" >> "$GITHUB_ENV"
      # Build and run are separate steps: the log shows each one's time, and a hung test fails only the run step
      # (its own timeout) so the cache is still saved after it; a job timeout would save nothing.
      - name: build tests (cargo test -p <shard> --no-run)
        id: build
        shell: bash
        run: '{ cargo test $SHARD --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/test.jsonl"; } 2>&1 | tee "$RUNNER_TEMP/build.log"'
      - name: run tests (cargo test -p <shard>)
        timeout-minutes: 45
        shell: bash
        run: cargo test $SHARD --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/run.log"
      # A red step names its crates (annotations in `gh run view`, table in the job summary).
      - name: Name the failing crates
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SUSPECTS: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          node .github/workflows/ci_report.mjs "test build" "$RUNNER_TEMP/build.log"
          node .github/workflows/ci_report.mjs "tests" "$RUNNER_TEMP/run.log"
      # A red test run still compiled everything: keep the cache, or main stays cold while red. A failed build is
      # not saved (its prune would drop every unit it never reached).
      - name: Prune the cache to this build's units
        id: prune
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: node .github/workflows/cargo_cache.mjs prune target/debug "$RUNNER_TEMP/test.jsonl" && du -sh target
      # Nothing compiled = the restored entry is still exact: no new 2 GB entry (10 GB cache budget for the repo;
      # three shards + clippy are ~6.9 GB when all four save).
      - uses: actions/cache/save@v6
        if: always() && steps.build.outcome == 'success' && github.ref == 'refs/heads/main' && steps.prune.outputs.compiled != '0'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-v2-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-s${{ matrix.shard }}of3-${{ github.sha }}
      - name: Disk left
        if: always()
        shell: bash
        run: df -h . || true

  clippy:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install || rustup show
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: clippy-v1-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: clippy-v1-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
      - name: Unchanged sources get an old mtime (cargo freshness)
        shell: bash
        run: node .github/workflows/cargo_cache.mjs mtimes
      - name: clippy --workspace
        id: clippy
        shell: bash
        run: '{ cargo clippy --workspace --all-targets --message-format=json-render-diagnostics -- -D warnings > "$RUNNER_TEMP/clippy.jsonl"; } 2>&1 | tee "$RUNNER_TEMP/clippy.log"'
      - name: clippy --workspace, dev-only code
        if: always()
        shell: bash
        run: '{ cargo clippy --workspace --all-targets --features bevyrrowind/dev --message-format=json-render-diagnostics -- -D warnings > "$RUNNER_TEMP/clippy-dev.jsonl"; } 2>&1 | tee "$RUNNER_TEMP/clippy-dev.log"'
      - name: Name the failing crates
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SUSPECTS: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          node .github/workflows/ci_report.mjs "clippy" "$RUNNER_TEMP/clippy.log"
          node .github/workflows/ci_report.mjs "clippy (dev)" "$RUNNER_TEMP/clippy-dev.log"
      # Saved when the first pass compiled; units a failing pass never reached are pruned, not kept stale.
      - name: Prune the cache to this run's units
        id: prune
        if: always() && steps.clippy.outcome == 'success'
        shell: bash
        run: node .github/workflows/cargo_cache.mjs prune target/debug "$RUNNER_TEMP/clippy.jsonl" "$RUNNER_TEMP/clippy-dev.jsonl" && du -sh target
      - uses: actions/cache/save@v6
        if: always() && steps.clippy.outcome == 'success' && github.ref == 'refs/heads/main' && steps.prune.outputs.compiled != '0'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: clippy-v1-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}

  # No compiling: licences/advisories, the workspace-hack, the tunables census.
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-hakari
      - name: cargo deny check
        run: cargo deny check
      - name: workspace-hack is current
        if: always()
        run: cargo hakari generate --diff && cargo hakari manage-deps --dry-run
      # Blocking again since the census cleanup (2026-11-26): a crate's count of candidate consts may only go down.
      - name: tunables census
        if: always()
        run: node tools/tunables-census.mjs --check
