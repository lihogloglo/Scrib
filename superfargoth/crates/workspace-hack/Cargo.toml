# Generated by `cargo hakari` (.config/hakari.toml); superfargoth/CLAUDE.md "Commands" has the workflow.
# Only the section between the BEGIN/END HAKARI SECTION lines is regenerated:
#     cargo hakari generate && cargo hakari manage-deps

[package]
name = "workspace-hack"
description = "Feature unification for the workspace's Bevy crates (superfargoth and bevyrrowind), managed by cargo-hakari: one build of each dependency for every `cargo test -p`"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

### BEGIN HAKARI SECTION
