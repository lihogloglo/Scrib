# Default climate class table for sf_worldgen::climate_classes (stage 6 (d)): a Whittaker-style rectilinear grid
# of (temperature, precipitation) bands, one class name per cell. Games ship their own table in this format; a value
# exactly on an edge belongs to the band above it.
source = "Industry(Whittaker 1975 biome diagram, band edges read off the figure)"
# Upper edges of the temperature bands (C), ascending; one more band above the last edge.
t_edges_c = [-5.0, 3.0, 12.0, 20.0]
# Upper edges of the precipitation bands (mm/yr), ascending; one more band above the last edge.
p_edges_mm = [250.0, 500.0, 1000.0, 2000.0, 2500.0]
# One row per temperature band (coldest first), one class per precipitation band (driest first).
classes = [
  ["tundra", "tundra", "tundra", "tundra", "tundra", "tundra"],
  ["cold desert", "taiga", "taiga", "taiga", "taiga", "taiga"],
  ["cold desert", "grassland", "woodland", "temperate forest", "temperate rainforest", "temperate rainforest"],
  ["desert", "shrubland", "woodland", "temperate forest", "temperate rainforest", "temperate rainforest"],
  ["desert", "savanna", "savanna", "seasonal forest", "seasonal forest", "rainforest"],
]
