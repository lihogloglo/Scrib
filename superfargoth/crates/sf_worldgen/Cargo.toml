[package]
name = "sf_worldgen"
description = "Bevy-free world generation for superfargoth: guide grids, resampling, macro stream-power and thermal erosion, hillshade previews, the scrib-worldgen recipe runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Bevy-free core (ARCHITECTURE §8b rule 1; worldgen.md "Crates and tool"): the macro stage runs on the CPU,
# deterministic (worldgen.md "Constraints"). `rayon` only maps pure per-sample functions, so results don't
# depend on the thread count.
[dependencies]
blake3.workspace = true
clap.workspace = true
# 8-bit gray and indexed PNG; already in Cargo.lock (through `image`), no default features.
png = "0.18"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[[bin]]
name = "scrib-worldgen"
path = "src/bin/scrib-worldgen.rs"

[lints]
workspace = true
