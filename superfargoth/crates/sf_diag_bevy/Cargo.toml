[package]
name = "sf_diag_bevy"
description = "Bevy plugin for sf_diag: frame sampling, scenarios, fly-through cameras, counters"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Asset-event churn counters (`AssetChurnPlugin<A>`).
assets = ["dep:bevy_asset"]
# Render-pipeline churn counters (`PipelineChurnPlugin`): the render world.
render = ["dep:bevy_render"]
# Per-view render counters (`RenderViewsPlugin`, static-scene.md S0): binned
# phases, preprocessing work items and bind groups in the render world.
views = ["render", "dep:bevy_core_pipeline", "dep:bevy_pbr"]
# Pipeline warm-up watch (`PipelineWatchPlugin`, pipeline-warmup.md W0): pending draws, compile
# times and view-key flips in the render world.
pipelines = ["render", "dep:bevy_asset", "dep:bevy_camera", "dep:bevy_mesh", "dep:bevy_pbr"]
# Live texture/material gauge (`TextureGaugePlugin`): GPU bytes per format family, normal/ORM maps on
# StandardMaterial, normal-mapped meshes without tangents (render-world vertex layouts).
textures = ["render", "dep:bevy_asset", "dep:bevy_camera", "dep:bevy_image", "dep:bevy_mesh", "dep:bevy_pbr"]

# Minimal Bevy (ARCHITECTURE §8b rule 6). No rendering crate by default: GPU
# timings arrive through `DiagnosticsStore` when the app adds `RenderDiagnosticsPlugin`.
[dependencies]
# App, Plugin, First schedule, AppExit.
bevy_app = { workspace = true, features = ["std"] }
# AssetEvent (feature `assets`); AssetId (feature `pipelines`).
bevy_asset = { workspace = true, optional = true }
# InheritedVisibility of meshes near a reveal (feature `pipelines`).
bevy_camera = { workspace = true, optional = true }
# Opaque3d / prepass / deferred phase types (feature `views`).
bevy_core_pipeline = { workspace = true, optional = true }
# Resource, Component, systems, MessageWriter.
bevy_ecs = { workspace = true, features = ["std"] }
# DiagnosticsStore: sampled into counters every frame.
bevy_diagnostic = { workspace = true, features = ["std"] }
# Instant of diagnostic measurements; HashMap.
bevy_platform = { workspace = true, features = ["std"] }
# Image texture descriptors (feature `textures`).
bevy_image = { workspace = true, optional = true }
# Mesh3d visibility class (feature `pipelines`).
bevy_mesh = { workspace = true, optional = true }
# Shadow phase, light views, mesh preprocessing buffers (feature `views`).
bevy_pbr = { workspace = true, optional = true }
# PipelineCache in the render world (feature `render`).
bevy_render = { workspace = true, optional = true }
# Time<Real>: the frame-time source; TimeSystems for ordering.
bevy_time = { workspace = true, features = ["std"] }
# Transform of the fly-through camera.
bevy_transform = { workspace = true, features = ["std", "bevy-support"] }
log.workspace = true
sf_diag.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
