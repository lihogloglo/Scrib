[package]
name = "sf_anim"
description = "Bevy-free skeletal animation core for superfargoth: skeletons, cooked clips, pose ops, IK, retargeting, bake steps"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Empty: the workspace dependency keeps default features on, and `--workspace` always enables a member's
# `default`, so a non-empty list here would make `test --workspace` build sf_anim (and all above it) differently
# from `build -p bevyrrowind` (build-perf.md "Feature unification"). Crates ask for `gltf` by name.
default = []
# The framework's glTF / GLB skeleton and clip importer.
gltf = ["dep:gltf"]
# The framework's BVH skeleton and clip importer (own parser, no dependencies). Bake only.
bvh = []
# The framework's FBX skeleton and clip importer, on ufbx (needs a C compiler). Bake only.
fbx = ["dep:ufbx"]

[dependencies]
glam = { workspace = true, features = ["serde"] }
gltf = { workspace = true, optional = true }
postcard.workspace = true
serde.workspace = true
sf_bake.workspace = true
thiserror.workspace = true
ufbx = { workspace = true, optional = true }

[dev-dependencies]
# This crate's own tests keep the glTF importer (`default` used to carry it).
sf_anim = { path = ".", features = ["gltf"] }
rayon.workspace = true
ron.workspace = true
tempfile.workspace = true

[lints]
workspace = true
