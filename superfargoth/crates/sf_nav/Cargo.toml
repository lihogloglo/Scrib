[package]
name = "sf_nav"
description = "Bevy-free navigation core for superfargoth (nav.md): agent classes, area table, query filters, goals, the NavBackend trait and the GridBackend test double"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Bevy-free core (build-perf.md rule 1): in hakari's final-excludes. No navmesh backend here:
# `sf_nav_recast` (NV2) implements `NavBackend` over navmesh-rs.
[dependencies]
bitflags.workspace = true
# Stable route node and edge ids (route_graph, like sf_world's LinkId).
blake3.workspace = true
glam = { workspace = true, features = ["serde"] }
# The GridBackend's tile blobs.
postcard.workspace = true
serde.workspace = true
sf_coords.workspace = true
# `ActorKey` in the query service's `RequestId` (no `bevy` feature: stays Bevy-free).
sf_ids.workspace = true
# Declared tunables (traverse times, NV11b); Bevy-free.
sf_tunables.workspace = true
# `Location` and `WorldspaceId`.
sf_world.workspace = true
# `PortalPath::links` (portal_query).
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
