[package]
name = "sf_action"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bevy-free action layer: commands, move rules, chooser, input buffer, net-ready state"

# Kept shallow on purpose (docs/specs/action.md). `sf_controller` supplies the Sim owner's
# `LocomotionIntent`/`Gait` vocabulary; `sf_anim` the Warp owner's `WarpPlan` and `RootPath`
# (B2a; already in the build through `sf_controller`). Slot lengths, windows and root paths come
# in through the `SlotSource` trait, so `sf_anim_graph` never joins; the `MoveRule` type is plain
# serde, so the shell registers it as an `sf_records` kind without a dependency here.
[dependencies]
glam = { workspace = true, features = ["serde"] }
ron.workspace = true
serde.workspace = true
sf_anim.workspace = true
sf_controller.workspace = true
# `PlayerId` (shared with `sf_rpg`).
sf_ids.workspace = true
thiserror.workspace = true

[dev-dependencies]
postcard.workspace = true
# `WorldPos` for the real-mover jump test.
sf_coords.workspace = true

[lints]
workspace = true
