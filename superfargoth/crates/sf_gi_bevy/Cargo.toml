[package]
name = "sf_gi_bevy"
description = "Bevy plugin for sf_gi: dynamic probe GI traced with hardware ray queries (Solari's scene), shown through IrradianceVolume"
version.workspace = true
edition.workspace = true
license.workspace = true

# Minimal Bevy (ARCHITECTURE section 8b rule 6).
[dependencies]
bevy_app = { workspace = true, features = ["std"] }
bevy_asset.workspace = true
bevy_camera.workspace = true
bevy_color.workspace = true
bevy_core_pipeline.workspace = true
bevy_diagnostic = { workspace = true, features = ["std"] }
bevy_ecs = { workspace = true, features = ["std"] }
bevy_image.workspace = true
bevy_light.workspace = true
bevy_math = { workspace = true, features = ["std"] }
bevy_mesh.workspace = true
bevy_pbr.workspace = true
bevy_render.workspace = true
bevy_shader.workspace = true
bevy_solari.workspace = true
bevy_time = { workspace = true, features = ["std"] }
bevy_transform = { workspace = true, features = ["std", "bevy-support"] }
log.workspace = true
sf_gi.workspace = true
# `GiActive` and the `RaytracingMesh3d` mirroring (`path.rs`), which lives behind `solari`.
sf_sky_bevy = { workspace = true, features = ["solari"] }
workspace-hack.workspace = true

[lints]
workspace = true
