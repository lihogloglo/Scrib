[package]
name = "sf_scene"
description = "Static scene core for superfargoth: baked per-cell instance tables, eligibility and promotion, GPU slot allocator, CPU twin of the per-view cull and LOD pick"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The `scene.cells` bake step over sf_bake products (world index, cooked meshes, terrain tiles).
bake = ["dep:sf_bake", "dep:sf_model", "dep:sf_terrain", "dep:sf_world", "sf_terrain/bake", "sf_world/bake"]

[dependencies]
bitflags.workspace = true
glam.workspace = true
sf_bake = { workspace = true, optional = true }
sf_coords.workspace = true
# Cooked mesh types only; no glTF importer.
sf_model = { path = "../sf_model", version = "0.1.0", default-features = false, optional = true }
sf_terrain = { workspace = true, optional = true }
sf_world = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
sf_vfs.workspace = true

[lints]
workspace = true
