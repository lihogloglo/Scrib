[package]
name = "sf_stats_bevy"
description = "Thin Bevy shell for sf_stats: the Stats component, table and rules resources, the fixed-tick StatSystems sets, StatCommand in and StatMessage out (stats.md S4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Minimal Bevy (build-perf.md): the logic lives in `sf_stats`; this crate schedules it.
[dependencies]
bevy_app = { workspace = true, features = ["std"] }
bevy_ecs = { workspace = true, features = ["std"] }
bevy_log.workspace = true
# `Time` (the fixed tick's length) in `FixedUpdate`.
bevy_time = { workspace = true, features = ["std"] }
sf_stats.workspace = true
workspace-hack.workspace = true

[lints]
workspace = true
