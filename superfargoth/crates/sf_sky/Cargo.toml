[package]
name = "sf_sky"
description = "Bevy-free sky core for superfargoth: time of day, sun and moon positions, light and exposure curves"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glam = { workspace = true, features = ["serde"] }
serde.workspace = true
# The calendar view the sky's `Calendar` is built from (`From<&CalendarView>`; clock.md "Sky in C3").
sf_calendar.workspace = true
# The game clock's instant (`SkyClock::from_instant`; clock.md).
sf_ids.workspace = true
sf_wind.workspace = true
# The lamp cache's values (`lamp_cache::TUNABLES`).
sf_tunables.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
