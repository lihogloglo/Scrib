[package]
name = "sf_app_bevy"
description = "The app's phases (Boot, Frontend, Loading, InGame) as Bevy states, and `WorldAlive` for gating world plugins (menus.md \"App phases\")"
version.workspace = true
edition.workspace = true
license.workspace = true

# Thin (ARCHITECTURE §8b rule 6): two state types and a plugin. The app gates world plugins'
# public system sets with them; no framework crate needs to know the phase.
[dependencies]
bevy_app = { workspace = true, features = ["std"] }
bevy_ecs = { workspace = true, features = ["std"] }
bevy_state = { workspace = true, features = ["std", "bevy_app"] }
workspace-hack.workspace = true

[lints]
workspace = true
