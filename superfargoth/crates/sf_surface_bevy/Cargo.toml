[package]
name = "sf_surface_bevy"
description = "Surface weather on the GPU (surface-weather.md W2-W4): the cell window texture, the vertical shelter depth map, the noise atlas, SurfaceUniform, the cover layer array, the mesh-view bindings of the vendored bevy_pbr patch SW and the `sf_surface_bevy::layer` WESL module (wetness, puddles)"
version.workspace = true
edition.workspace = true
license.workspace = true

# Thin (build-perf.md rule 6): the window, shelter and noise logic is Bevy-free (sf_surface::view).
[dependencies]
bevy_app = { workspace = true, features = ["std"] }
bevy_asset.workspace = true
# Aabb, InheritedVisibility, Camera3d (shelter casters, the view).
bevy_camera.workspace = true
# Core3d: the trail ring pass runs before the prepass (W6a).
bevy_core_pipeline.workspace = true
bevy_ecs = { workspace = true, features = ["std"] }
bevy_image.workspace = true
# DirectionalLight, NotShadowCaster (the shelter view rides the shadow pass).
bevy_light.workspace = true
bevy_math = { workspace = true, features = ["std"] }
# Instant for the upload timer.
bevy_platform = { workspace = true, features = ["std"] }
# Mesh3d, SkinnedMesh (characters don't shelter).
bevy_mesh.workspace = true
# AlphaMode: the kick-up material (W7).
bevy_material.workspace = true
# SurfaceWeatherView / SurfaceWeatherBindings: the mesh-view bindings (vendored bevy_pbr patch "SW").
bevy_pbr.workspace = true
# TypePath: the kick-up material (W7).
bevy_reflect = { workspace = true, features = ["std"] }
# ShaderBuffer, RenderApp, partial texture writes.
bevy_render.workspace = true
bevy_shader.workspace = true
# Time: the rain rings' animation clock (W4).
bevy_time = { workspace = true, features = ["std"] }
bevy_transform = { workspace = true, features = ["std", "bevy-support"] }
# Counters (`surface/...`) when the app runs `SfDiagPlugin`.
sf_diag_bevy.workspace = true
# WorldPos (the floating origin the shelter map follows).
sf_coords.workspace = true
# TranslucentFog, DrawBand: the kick-up puffs fog themselves and draw in the overlay band (W7).
sf_render_order_bevy.workspace = true
# The shelter subview (`sun_view`, as WE-5's precipitation occlusion map).
sf_sky_bevy = { path = "../sf_sky_bevy", version = "0.1.0" }
sf_surface.workspace = true
# `mip_chain` (the terrain layer arrays' filter) packs the cover layer array (W5a).
sf_terrain = { workspace = true, features = ["bake"] }
# WorldSurface (the state), WorldWeatherMap (raster), WeatherSite, SurfaceDebug.
sf_weather_bevy.workspace = true
workspace-hack.workspace = true

[lints]
workspace = true

[dev-dependencies]
sf_wind_bevy.workspace = true
# Shader compile checks (no GPU, no picture): wesl links the real modules (vendored bevy_pbr with
# patch SW, terrain, far proxies, ours) per def set, as Bevy's shader cache does; naga validates.
naga = { workspace = true, features = ["wgsl-in"] }
wesl = { workspace = true, features = ["naga-ext"] }
