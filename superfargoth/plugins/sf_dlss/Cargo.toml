[package]
name = "sf_dlss"
version = "0.1.0"
edition = "2024"
description = "NVIDIA DLSS (NGX) plugin for superfargoth's dlss_wgpu facade; links NVIDIA's NGX SDK, shipped separately"
license = "MIT OR Apache-2.0"
publish = false

# Own workspace: the game workspaces never build this crate (it needs NVIDIA's SDK).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ash = { version = "0.38", default-features = false }

[build-dependencies]
bindgen = "0.73"
cc = "1"

[profile.release]
debug = "line-tables-only"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
