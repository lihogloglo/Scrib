# superfargoth patch: drop-in facade for crates.io dlss_wgpu 6.0.0 (same name, version and
# public API). It holds no NVIDIA code and needs no NVIDIA SDK to build: the NGX calls live in
# the separately shipped `sf_dlss` plugin (superfargoth/plugins/sf_dlss), loaded at runtime
# through the C ABI in src/abi.rs. See README.md "superfargoth patch".
[package]
edition = "2024"
name = "dlss_wgpu"
version = "6.0.0"
description = "Adds support for using DLSS with wgpu (superfargoth facade: NGX in a runtime plugin)"
readme = "README.md"
categories = ["graphics", "rendering"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevyengine/dlss_wgpu"
publish = false

[features]
# Ask the plugin to load NVIDIA's development runtime (on-screen overlay).
debug_overlay = []
# No DLSS at all (Bevy's `force_disable_dlss`): exports nothing, as upstream.
mock = []

[lib]
name = "dlss_wgpu"
path = "src/lib.rs"

[dependencies]
ash = "0.38"
bitflags = "2"
thiserror = "2"
uuid = "1"
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
# superfargoth patch: runtime plugin loading and the one "plugin found / not found" log line.
libloading = "0.8"
tracing = { version = "0.1", default-features = false, features = ["std"] }
