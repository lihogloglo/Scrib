[dependencies.avian3d]
version = "0.8"
features = [
    "3d",
    "parry-f32",
]
optional = true
default-features = false

[dependencies.bevy]
version = "0.20"
features = [
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
]
default-features = false

[dependencies.bevy_rapier3d]
version = "0.37"
features = ["dim3"]
optional = true
default-features = false

[dependencies.bytemuck]
version = "1"

[dependencies.ron]
version = "0.12"

[dependencies.serde]
version = "1"
features = ["derive"]

[dev-dependencies.bevy]
version = "0.20"
features = [
    "3d",
    "tonemapping_luts",
    "free_camera",
    "ui",
    "default_font",
]
default-features = false

[dev-dependencies.image]
version = "0.25"
features = ["png"]
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.bevy]
version = "0.20"
features = ["file_watcher"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.bevy]
version = "0.20"
features = ["webgpu"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Location",
]

