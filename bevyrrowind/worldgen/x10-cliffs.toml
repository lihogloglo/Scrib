# Phase 3b: Fast steerable macro sharp-landform pass for Vvardenfell 10x (base: target/worldgen/x10v/s55).
# Owner 2026-11-20: aggressive dramatic cliffs and escarpments are welcome; keep generation fast for quick tests.
# Run (~3-5 s per arm):
#   scrib-worldgen cliffs --base target/worldgen/x10v/s55 --params bevyrrowind/worldgen/x10-cliffs.toml --out target/worldgen/x10c
# Then re-stamp settlements and layers (~3.7 s):
#   bevyrrowind worldgen-x10 --heights target/worldgen/x10c/dramatic --out target/worldgen/x10cs
#   bevyrrowind worldgen-layers --guide target/worldgen/x10cs

[params]
seed = { v = 77, unit = "id", min = 0, max = 4294967295, source = "Guess" }
coast_fade_m = { v = 4.0, unit = "m", min = 0.1, max = 200.0, source = "Guess" }
unit_cell_m = { v = 1400.0, unit = "m", min = 100.0, max = 20000.0, source = "Guess" }
unit_warp_m = { v = 320.0, unit = "m", min = 0.0, max = 5000.0, source = "Guess" }
scarp_amp_m = { v = 60.0, unit = "m", min = 0.0, max = 400.0, source = "Guess" }
scarp_wavelength_m = { v = 600.0, unit = "m", min = 40.0, max = 10000.0, source = "Guess" }
scarp_steepness = { v = 0.85, unit = "ratio", min = 0.55, max = 0.96, source = "Guess" }
scarp_warp_m = { v = 180.0, unit = "m", min = 0.0, max = 3000.0, source = "Guess" }
shelf_amp_m = { v = 36.0, unit = "m", min = 0.0, max = 300.0, source = "Guess" }
shelf_step_m = { v = 56.0, unit = "m", min = 5.0, max = 500.0, source = "Guess" }
shelf_sharpness = { v = 0.84, unit = "ratio", min = 0.0, max = 1.0, source = "Guess" }
steepen_gain = { v = 1.5, unit = "ratio", min = 0.0, max = 6.0, source = "Guess" }
steepen_slope_deg = { v = 13.0, unit = "deg", min = 1.0, max = 60.0, source = "Guess" }
steepen_cap_m = { v = 75.0, unit = "m", min = 0.0, max = 400.0, source = "Guess" }
mask_boost_m = { v = 50.0, unit = "m", min = 0.0, max = 300.0, source = "Guess" }
sea_cliff_amp_m = { v = 42.0, unit = "m", min = 0.0, max = 200.0, source = "Guess" }
sea_cliff_band_m = { v = 45.0, unit = "m", min = 2.0, max = 300.0, source = "Guess" }
hard_talus_deg = { v = 70.0, unit = "deg", min = 20.0, max = 85.0, source = "Industry(hard basalt/cap-rock cliff face repose 60-75 deg)" }
soft_talus_deg = { v = 34.0, unit = "deg", min = 15.0, max = 60.0, source = "Industry(scree/talus angle of repose 32-36 deg)" }
thermal_steps = { v = 16, unit = "count", min = 0, max = 200, source = "Guess" }
thermal_rate = { v = 0.30, unit = "ratio", min = 0.01, max = 0.5, source = "Industry(Olsen 2004: Jacobi stability <= 0.5)" }
lava_flow_count = { v = 32, unit = "count", min = 0, max = 200, source = "Guess" }
lava_thickness_m = { v = 26.0, unit = "m", min = 0.0, max = 120.0, source = "Industry(Etna/Hawaii aa-lava flow fronts 5-30 m)" }
lava_width_m = { v = 260.0, unit = "m", min = 20.0, max = 2500.0, source = "Guess" }
lava_length_m = { v = 5200.0, unit = "m", min = 100.0, max = 25000.0, source = "Guess" }
lava_levee_ratio = { v = 0.30, unit = "ratio", min = 0.0, max = 0.8, source = "Guess" }

