# Steerable hero escarpment strokes (guide metres: x east, y north).
# Red Mountain western/southern Ghostfence ridge wall & Caldera flank escarpment.
[[stroke]]
name = "red_mountain_sw_scarp"
from_m = [-1800.0, 5200.0]
to_m = [4800.0, 3600.0]
throw_m = 160.0
wall_width_m = 55.0
apron_width_m = 900.0
warp_m = 260.0
warp_wavelength_m = 1400.0

[[stroke]]
name = "west_gash_escarpment"
from_m = [-7800.0, 6400.0]
to_m = [-4200.0, -3200.0]
throw_m = 110.0
wall_width_m = 48.0
apron_width_m = 750.0
warp_m = 240.0
warp_wavelength_m = 1200.0

[[stroke]]
name = "molag_amur_rim"
from_m = [5800.0, 4200.0]
to_m = [11500.0, -4800.0]
throw_m = 130.0
wall_width_m = 50.0
apron_width_m = 800.0
warp_m = 280.0
warp_wavelength_m = 1500.0

[[arm]]
name = "sharp"
help = "balanced dramatic cliffs, fault-block cuestas, stepped rock shelves and coastal headlands"

[[arm]]
name = "dramatic"
help = "aggressive towering escarpments, deeper shelves and sharper oversteepened ridges (owner 2026-11-20)"
set = { scarp_amp_m = 95.0, shelf_amp_m = 52.0, steepen_gain = 2.2, steepen_cap_m = 110.0, sea_cliff_amp_m = 62.0 }
