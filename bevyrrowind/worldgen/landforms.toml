# Landforms recipe for Vvardenfell + Solstheim (adapter data, `superfargoth/docs/specs/landforms.md` "Pipeline" step 4,
# read by `scrib-worldgen place --recipe`). `[values]` override declared placement values; `[region."<regions.json
# name>"]` rows set per-region knobs: weight (score multiplier, 0 = no faults), face_budget, throw_ratio, size_min_m,
# size_max_m. Throw = throw_ratio x fault length (Cowie & Scholz 1992: D/L ~ 0.01-0.03), +-segment_throw_var,
# +-throw_noise along strike.
#
# LF-2b (owner 2026-11-22: "fewer, taller faults where the region allows, dramatic"): the ash wastes and the western
# highlands get long, tall fault blocks (~60-200 m), the Grazelands and the farmland low ones, Red Mountain none (its
# relief is the volcano's). All values Guess (owner direction), tuned in look loops (decision 9).

[region."West Gash Region"]
throw_ratio = 0.025
size_min_m = 2500.0
size_max_m = 8000.0

[region."Ashlands Region"]
throw_ratio = 0.025
