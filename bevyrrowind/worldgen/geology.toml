tuff = 0.20
capped_sediment = 0.10

[region."Bitter Coast Region".shares]
alluvium = 0.85
coastal_basalt = 0.15

# ---------------------------------------------------------------- Solstheim (stand-ins; its own recipe comes later)
# Basalt island under glacial till (Analogue: Iceland / Jan Mayen); till stands in as `alluvium`. Guess.

[region."Solstheim, Moesring Mountains".shares]
