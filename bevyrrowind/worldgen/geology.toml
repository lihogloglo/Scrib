# LF-A1: Vvardenfell's rock units for the geology map (`sf_worldgen::geology`, read by `scrib-worldgen geology`).
# Specs: superfargoth/docs/specs/landforms.md "Data model" (fields), bevyrrowind/docs/specs/worldgen-adapter.md
# "Landforms (LF-A)" (units, regions, sources). Glue and checks: `mw_worldgen::geology`.
#
# Units are stand-ins for Vvardenfell's volcanic geology. Sources per value, in the comment after it:
#   Lore     = game regions and their land textures (Red Mountain lava fields, Ashlands ash, West Gash crags,
#              Azura's Coast and Sheogorad dark rocky isles, Bitter Coast swamp, Ascadian farmland);
#   Analogue = real volcanic islands named in the adapter spec (Etna, Teide, Iceland, Hawaii) and textbook values;
#   Guess    = no measurement yet, settled by an owner arm (counted like any `Guess` tunable).
# `k` is the erodibility multiplier (1 = the recipe's base K; as `lithology::RockType`).
#
# Layer ids: `[layer_names.<unit>]` names LTEX record ids of the guide's `layers.json` palette (resolved
# case-insensitively by `mw_worldgen::geology::AdapterGeology::resolve_layers`, which writes the numeric
# `layers = { top, face, scree }` the framework reads). The framework ignores `[layer_names]`; read raw, units
# carry layers 0 (`@default`).
#
# Regions: one `[region."<regions.json name>"]` row per region of the island (Vvardenfell + Solstheim, the
# REGN `name`s of the guide legend). Solstheim rows are stand-ins until its own recipe (adapter spec: out of scope).

# ---------------------------------------------------------------- units

[[unit]]
# Stacked aa / pahoehoe flow units with scoria (clinker) partings: Red Mountain, Molag Amur, the Ashlands highs.
name = "basalt_flow"
hardness = 0.85          # Lore + Analogue (adapter spec table; fresh basalt is the hardest unit here)
k = 0.5                  # Guess (half the base erodibility)
layered = true
bed_m = [2.0, 8.0]       # Analogue (Hawaii / Etna flow units 1-10 m; adapter spec 2-8 m)
soft_bed_share = 0.25    # Guess (clinker / scoria partings between flows)
dip_mode = "surface"     # adapter spec: beds parallel to the low-passed cone (radial from the summit)
repose_hard_deg = 72.0   # Analogue (lava cliff faces; landforms.md hard 68-72)
repose_soft_deg = 34.0   # Analogue (scoria repose 33-35)
outcrop = true

[[unit]]
# Welded and bedded ash (ignimbrite / tuff): the Ashlands and West Gash slopes.
name = "tuff"
hardness = 0.55          # Lore + Analogue (adapter spec table)
k = 1.2                  # Guess
layered = true
bed_m = [1.0, 4.0]       # Analogue (Teide / Iceland ignimbrite and fall beds; adapter spec 1-4 m)
soft_bed_share = 0.4     # Guess (unwelded ash beds between welded ones)
dip_mode = "surface"     # adapter spec
repose_hard_deg = 68.0   # Guess (landforms.md hard 68-72, low end for a weaker rock)
repose_soft_deg = 34.0   # Analogue (loose ash repose 33-35)
outcrop = true

[[unit]]
# Loose ash and lapilli fields: Ashlands plains, the Red Mountain apron, Molag Amur ash fields.
name = "tephra"
hardness = 0.15          # Lore + Analogue (adapter spec table)
k = 3.0                  # Guess (unconsolidated: erodes fastest of the volcanic units)
layered = false          # adapter spec: no beds
dip_mode = "surface"     # unused without beds
repose_hard_deg = 35.0   # Analogue (loose tephra stands no steeper than its repose)
repose_soft_deg = 33.0   # Analogue (tephra cone repose 33-34)
outcrop = false

[[unit]]
# Hard cap over soft beds (mesas, cuestas): the West Gash highlands and the Grazelands plateau.
name = "capped_sediment"
hardness = 0.75          # Lore + Analogue (adapter spec: 0.75 cap; soft beds 0.75 x soft_bed_ratio 0.5 = 0.375,
                         # spec 0.3, close enough for a Guess)
k = 0.8                  # Guess
layered = true
bed_m = [3.0, 12.0]      # Analogue (adapter spec 3-12 m)
soft_bed_share = 0.5     # Guess (alternating cap and soft beds)
dip_deg = 3.5            # Analogue (adapter spec Fixed 2-5 deg)
dip_mode = { fixed = { azimuth_deg = 255.0 } }  # Guess (dipping west-southwest, away from Red Mountain to the sea)
repose_hard_deg = 70.0   # Analogue (cap-rock faces 60-75)
repose_soft_deg = 33.0   # Analogue (talus repose 32-36)
outcrop = true

[[unit]]
# Columnar coastal basalt (Giant's Causeway, Reynisfjara analogues): Azura's Coast, Sheogorad.
name = "coastal_basalt"
hardness = 0.9           # Lore + Analogue (adapter spec table)
k = 0.4                  # Guess
layered = true
bed_m = [5.0, 15.0]      # Analogue (colonnade / entablature tiers 5-15 m; adapter spec)
soft_bed_share = 0.15    # Guess (thin flow tops between tiers)
dip_deg = 0.0            # Analogue (adapter spec Fixed ~0 deg: flat-lying sheets)
dip_mode = { fixed = { azimuth_deg = 0.0 } }
repose_hard_deg = 72.0   # Analogue (landforms.md hard 68-72)
repose_soft_deg = 35.0   # Analogue (block talus)
outcrop = true

[[unit]]
# River and swamp deposits: the Bitter Coast and the Ascadian Isles lowlands.
name = "alluvium"
hardness = 0.05          # Lore + Analogue (adapter spec table)
k = 4.0                  # Guess (unconsolidated silt and sand)
layered = false          # adapter spec: no beds
dip_mode = "surface"     # unused without beds
repose_hard_deg = 34.0   # Analogue (no rock faces: repose of sand)
repose_soft_deg = 30.0   # Analogue (wet sediment)
outcrop = false

# ---------------------------------------------------------------- default (legend index 0: land outside any region)

[shares]
tuff = 0.5               # Guess
alluvium = 0.5           # Guess

# ---------------------------------------------------------------- Vvardenfell regions (adapter spec "Rock units")
