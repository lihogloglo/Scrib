[region."Red Mountain Region".shares]
basalt_flow = 0.55
tephra = 0.35
tuff = 0.10

[region."Ashlands Region".shares]
tuff = 0.40
tephra = 0.40
basalt_flow = 0.20

[region."Molag Amur Region".shares]
basalt_flow = 0.50
tephra = 0.30
tuff = 0.20

[region."West Gash Region".shares]
capped_sediment = 0.55
tuff = 0.30
basalt_flow = 0.15

[region."Grazelands Region".shares]
capped_sediment = 0.60
alluvium = 0.25
tuff = 0.15

[region."Azura's Coast Region".shares]
coastal_basalt = 0.60
alluvium = 0.25
tuff = 0.15

[region."Sheogorad Region".shares]
