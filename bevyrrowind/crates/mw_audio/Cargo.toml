[package]
name = "mw_audio"
description = "Morrowind sound content for sf_audio: SOUN bank and cues, SNDG creature cues, door and loop-emitter sounds, footsteps, music playlists (audio.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Bevy-free (ARCHITECTURE section 8b rule 6): records in, sf_audio data out. The app's audio.rs is the glue.
[dependencies]
# Voice lines: INFO filters and the dialogue tables (`voice`).
mw_rpg.workspace = true
sf_audio.workspace = true
sf_rpg.workspace = true
sf_records.workspace = true
sf_vfs.workspace = true
tes3 = { workspace = true, features = ["esp"] }

[dev-dependencies]
# tests/voices.rs: voice selection on the real ESMs (skips without an install).
mw_install.workspace = true
mw_records.workspace = true
mw_vfs.workspace = true

[lints]
workspace = true
