[package]
name = "mw_bake"
description = "Morrowind adapter for the superfargoth bake: NIF importer, VFS and record inputs, model, world index and terrain bake"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# DDS and KTX2 container parsing for CPU texture decodes (`textures`; both already in the tree via bevy_image).
ddsfile = "0.6"
ktx2.workspace = true
dirs.workspace = true
glam.workspace = true
# TGA/BMP/PNG decoding (already in the tree via bevy_image).
image = { version = "0.25", default-features = false, features = ["tga", "bmp", "png"] }
# `anim`: actor animation sets (recipes), KF/NIF import, graph templates.
mw_actors.workspace = true
mw_anim.workspace = true
mw_graphs.workspace = true
# `nav`: pathgrid nodes for door approach points.
mw_ai.workspace = true
mw_install.workspace = true
mw_nif.workspace = true
# Item rules and mass (`body.cook` report, `items.check` rules).
mw_physics.workspace = true
mw_records.workspace = true
# `mwscript.translate` + `mwscript.coverage` (scripting-adapter.md, M5 W2).
mw_script.workspace = true
mw_world.workspace = true
# `mw.anim.groups` products.
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon.workspace = true
# `texture_profiles`: pack profiles as data (`data/texture_profiles.ron`).
ron.workspace = true
serde = { version = "1", features = ["derive"] }
# `census`: `bands.json` for the motion-generation planner (MG4).
serde_json.workspace = true
# `gltf`: the user's clip libraries (GLB) in the animation bake (`sources`).
sf_anim = { workspace = true, features = ["gltf", "bvh"] }
sf_anim_graph = { workspace = true, features = ["bake"] }
sf_bake.workspace = true
sf_character.workspace = true
# `collision.cook`: static collision for `StaticProbe` (actors-adapter.md).
sf_controller = { workspace = true, features = ["bake"] }
# `nav`: region-local positions.
sf_coords.workspace = true
sf_lod = { workspace = true, features = ["bake"] }
sf_model.workspace = true
# `texture_profiles`: a mod manifest's `[texture]` section picks its pack profile.
sf_mods.workspace = true
# `nav`: the navmesh adapter (nav.md "Bake"): sf_nav_bake steps on the Recast backend.
sf_nav.workspace = true
sf_nav_bake.workspace = true
sf_nav_recast.workspace = true
# `body.cook` and `items.check` (physics-adapter.md "Items").
sf_physics = { workspace = true, features = ["bake"] }
# `ragdoll.cook` (physics-adapter.md "Ragdolls").
sf_ragdoll = { workspace = true, features = ["bake"] }
sf_records.workspace = true
# `scene.cells`: per-cell static scene tables (static-scene.md S1b).
sf_scene = { workspace = true, features = ["bake"] }
# Luau `Compiler` for translated scripts (re-exported mlua).
sf_script.workspace = true
sf_terrain = { workspace = true, features = ["bake"] }
# `texture.delight`: de-lighting, mips and BC7 KTX2 (bake.md "De-lighting").
sf_texture.workspace = true
sf_vfs.workspace = true
sf_world = { workspace = true, features = ["bake"] }
tes3 = { workspace = true, features = ["esp"] }

[dev-dependencies]
# `textures` tests: the old BC1-BC3 decoder the framework decode is checked against (pure Rust, MIT).
texpresso = "2"
mw_vfs.workspace = true
tempfile.workspace = true
# The mantle grip end-to-end test plans its warps with the shipped rules.
sf_action.workspace = true

[lints]
workspace = true
