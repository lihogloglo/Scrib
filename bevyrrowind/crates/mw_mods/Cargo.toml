[package]
name = "mw_mods"
description = "Morrowind content as superfargoth mods: the ContentAdapter, the builtin mod, user mods and profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dirs.workspace = true
mw_install.workspace = true
mw_records.workspace = true
mw_vfs.workspace = true
mw_weather.workspace = true
semver.workspace = true
# The `sf.ai.perception_profile` / `sf.ai.perception_state` record kinds (NPC sight, MA14).
sf_ai.workspace = true
# The `sf.calendar` record kind (the builtin mod's Tamrielic calendar).
sf_calendar.workspace = true
sf_mods.workspace = true
sf_records.workspace = true
# The `sf.tunable` / `sf.tunable_preset` record kinds (the builtin mod's graphics presets).
sf_tunables.workspace = true
sf_vfs.workspace = true
tes3 = { workspace = true, features = ["esp", "bsa"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
