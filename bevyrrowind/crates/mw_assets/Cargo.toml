[package]
name = "mw_assets"
description = "Morrowind NIF/DDS assets as Bevy assets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bevy = { workspace = true, features = ["bevy_pbr", "bevy_world_serialization", "bevy_log", "dds", "tga", "bmp"] }
sf_vfs = { workspace = true, features = ["bevy"] }
mw_bake.workspace = true
mw_nif.workspace = true
sf_model.workspace = true
sf_model_bevy.workspace = true
sf_sky_bevy.workspace = true
sf_render_order_bevy.workspace = true
mw_world.workspace = true
thiserror.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# Shader compile checks (no GPU, no picture): wesl links particles.wesl against the vendored
# bevy_pbr per def set, as Bevy's shader cache does; naga validates (as sf_surface_bevy's).
naga = { workspace = true, features = ["wgsl-in"] }
wesl = { workspace = true, features = ["naga-ext"] }

[lints]
workspace = true

