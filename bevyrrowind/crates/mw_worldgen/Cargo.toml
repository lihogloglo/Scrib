[package]
name = "mw_worldgen"
description = "Morrowind worldgen adapter: source terrain and region map exports and measurements (WG-S1, WG-R2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
blake3.workspace = true
# WG-X5 flora placements (`flora`): poses and `sf_world::Placement`s; all already in mw_world's graph.
glam.workspace = true
mw_records.workspace = true
mw_world.workspace = true
# 16-bit gray and indexed PNG writing; already in Cargo.lock (through `image`), no default features.
png = "0.18"
serde.workspace = true
serde_json.workspace = true
sf_coords.workspace = true
sf_records.workspace = true
# RG-P2 library rocks as placements: the decoded variant libraries (`sf_rockgen::Libraries`); Bevy-free, no features.
sf_rockgen.workspace = true
sf_vfs.workspace = true
sf_world.workspace = true
sf_worldgen.workspace = true
tes3 = { workspace = true, features = ["esp"] }
# LF-A1 `geology`: the adapter half of `geology.toml` (`[layer_names]`); already in sf_worldgen's graph.
toml.workspace = true

[dev-dependencies]
# WG-E2m measurement on x10s: the player's install, its archives, model bounds (all Bevy-free, in the graph).
mw_install.workspace = true
mw_nif.workspace = true
mw_vfs.workspace = true
tempfile.workspace = true

[lints]
workspace = true
