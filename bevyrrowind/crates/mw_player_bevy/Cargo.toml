[package]
name = "mw_player_bevy"
description = "Morrowind player character: body, controls, camera, arrival gate, focus ray and prompt (app-split.md slice 7)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Sub-crates, as the framework's plugin crates take them (superfargoth ARCHITECTURE §8b rule 6).
bevy_app = { workspace = true, features = ["std"] }
bevy_asset.workspace = true
bevy_camera.workspace = true
bevy_camera_controller = { workspace = true, features = ["free_camera"] }
bevy_color = { workspace = true, features = ["std"] }
bevy_ecs = { workspace = true, features = ["std"] }
bevy_enhanced_input.workspace = true
bevy_input = { workspace = true, features = ["keyboard", "mouse"] }
bevy_log.workspace = true
bevy_math = { workspace = true, features = ["std"] }
bevy_mesh.workspace = true
bevy_pbr.workspace = true
bevy_shape.workspace = true
bevy_text.workspace = true
bevy_time = { workspace = true, features = ["std"] }
bevy_transform = { workspace = true, features = ["std", "bevy-support"] }
bevy_ui.workspace = true
bevy_window = { workspace = true, features = ["std"] }
mw_ai.workspace = true
mw_controls_bevy.workspace = true
mw_doors_bevy.workspace = true
mw_game_core.workspace = true
mw_walkers_bevy.workspace = true
mw_world.workspace = true
sf_action.workspace = true
sf_action_bevy.workspace = true
sf_camera.workspace = true
sf_camera_bevy.workspace = true
sf_character_bevy = { workspace = true, features = ["world"] }
sf_controller.workspace = true
sf_controller_bevy.workspace = true
sf_coords.workspace = true
sf_physics.workspace = true
sf_physics_bevy = { workspace = true, features = ["controller"] }
sf_records.workspace = true
sf_script.workspace = true
sf_script_bevy.workspace = true
sf_ui.workspace = true
sf_ui_bevy.workspace = true
sf_world.workspace = true
sf_world_bevy.workspace = true
tes3 = { workspace = true, features = ["esp"] }
workspace-hack.workspace = true

[dev-dependencies]
# The moved player tests: input plugins, a level as the ground, a keymap profile, VFS paths.
bevy_input = { workspace = true, features = ["std", "bevy_reflect", "keyboard", "mouse", "gamepad"] }
sf_level.workspace = true
sf_mods.workspace = true
sf_vfs.workspace = true

[lints]
workspace = true
