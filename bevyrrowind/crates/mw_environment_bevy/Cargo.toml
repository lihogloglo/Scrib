[package]
name = "mw_environment_bevy"
description = "The game's environment layer: water, weather, night sky, render settings (app-split.md slice 6)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# `bevyrrowind/status` weather (`weather::LiveWeather`, `live_weather`); the app's `remote` turns it on.
remote = ["dep:serde", "dep:schemars"]
# `render.rs` warns when `--rt` runs without it; the app's `solari` turns it on.
solari = []
# DLSS: the project id before `DefaultPlugins` (`RenderSettings::init`); the app's `dlss` turns it on.
dlss = ["dep:bevy_anti_alias", "bevy_anti_alias/dlss", "dep:bevy_asset"]

[dependencies]
# Sub-crates, as the framework's plugin crates take them (superfargoth ARCHITECTURE §8b rule 6).
bevy_anti_alias = { workspace = true, optional = true }
bevy_app = { workspace = true, features = ["std"] }
bevy_asset = { workspace = true, optional = true }
bevy_camera.workspace = true
bevy_color = { workspace = true, features = ["std"] }
bevy_ecs = { workspace = true, features = ["std"] }
bevy_light.workspace = true
bevy_log.workspace = true
bevy_math = { workspace = true, features = ["std"] }
bevy_pbr.workspace = true
bevy_post_process.workspace = true
bevy_render.workspace = true
bevy_time = { workspace = true, features = ["std"] }
bevy_transform = { workspace = true, features = ["std", "bevy-support"] }
clap.workspace = true
glam.workspace = true
mw_boot_bevy.workspace = true
mw_game_core.workspace = true
mw_install.workspace = true
mw_water.workspace = true
mw_weather.workspace = true
mw_world.workspace = true
schemars = { version = "1.2", optional = true }
serde = { workspace = true, optional = true }
sf_atmos_bevy.workspace = true
sf_audio.workspace = true
sf_character_bevy.workspace = true
sf_coords.workspace = true
sf_physics_bevy.workspace = true
sf_records.workspace = true
sf_shadow_cache_bevy.workspace = true
sf_sky_bevy.workspace = true
sf_terrain_bevy.workspace = true
sf_vfs.workspace = true
sf_water.workspace = true
sf_water_bevy.workspace = true
sf_weather.workspace = true
sf_world.workspace = true
sf_world_bevy.workspace = true
tes3 = { workspace = true, features = ["esp"] }
workspace-hack.workspace = true

[lints]
workspace = true
