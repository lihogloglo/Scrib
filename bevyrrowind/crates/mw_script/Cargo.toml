[package]
name = "mw_script"
description = "MWScript front end: lenient lexer and parser with named leniency rules, AST, function table, name resolution (scripting-adapter.md). Native interpreter (dialogue results, W3), Luau emitter, coverage report, `mw` runtime skeleton, global script instances. Bevy-free"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
sf_tunables.workspace = true

[dev-dependencies]
serde_json.workspace = true
mw_install.workspace = true
# Loading generated modules in a real sandboxed context (tests only).
sf_script.workspace = true
sf_vfs.workspace = true
tes3 = { workspace = true, features = ["esp"] }

[lints]
workspace = true
