# The def types this adapter fills.
sf_interaction.workspace = true
# `RecordId`: the def's base record.
sf_records.workspace = true
# `mw.rules.interaction.sit`, `mw.interact.*` declarations (Bevy-free).
sf_tunables.workspace = true
smallvec.workspace = true

