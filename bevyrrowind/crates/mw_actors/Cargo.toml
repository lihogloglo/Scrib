[package]
name = "mw_actors"
description = "Morrowind NPC_/CREA records as sf_character recipes: race skin parts, head and hair, ARMO/CLOT part lists as wearables, auto-equip, race scale, first person"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
glam.workspace = true
# Humanoid rig maps and creature movers on the Bip01 skeletons.
mw_anim.workspace = true
# Smooth-body probe poses (`probes`): skeleton, clip sampling.
sf_anim.workspace = true
# `had_skin`: skinned or rigid part.
mw_nif.workspace = true
# `model_path` (mesh field → VFS path).
mw_world.workspace = true
sf_character.workspace = true
sf_records.workspace = true
sf_vfs.workspace = true
tes3 = { workspace = true, features = ["esp"] }

[dev-dependencies]
mw_install.workspace = true
mw_records.workspace = true
mw_vfs.workspace = true
# tests/outfit_memory.rs cooks real parts the way the bake does.
mw_bake.workspace = true
sf_model.workspace = true
# examples/smooth_body.rs: the smooth-body step.
sf_character = { workspace = true, features = ["smooth"] }
# tests/held_install.rs: weapon type → graph stance counts.
mw_graphs.workspace = true
# examples/cloth_census.rs: cloth rules, ragdoll colliders, `cloth.cook`.
mw_physics.workspace = true
sf_ragdoll.workspace = true

[lints]
workspace = true
