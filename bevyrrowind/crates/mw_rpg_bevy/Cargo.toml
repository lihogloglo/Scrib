[package]
name = "mw_rpg_bevy"
description = "The RPG layer in the streamed view: dialogue/journal glue (Rpg), item pickup and containers, the inventory screen (app-split.md slice 9)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Sub-crates, as the framework's plugin crates take them (superfargoth ARCHITECTURE §8b rule 6).
bevy_app = { workspace = true, features = ["std"] }
bevy_camera_controller = { workspace = true, features = ["free_camera"] }
bevy_ecs = { workspace = true, features = ["std"] }
bevy_enhanced_input.workspace = true
bevy_input = { workspace = true, features = ["keyboard"] }
bevy_log.workspace = true
bevy_ui.workspace = true
mw_boot_bevy.workspace = true
mw_controls_bevy.workspace = true
# Morrowind's MGEF table for the effects glue (`effects`).
mw_effects.workspace = true
mw_game_core.workspace = true
mw_records.workspace = true
mw_rpg.workspace = true
mw_script.workspace = true
mw_scripts_bevy.workspace = true
# Character stats (`stats`): Morrowind's table, init and OpenMW rules.
mw_stats.workspace = true
mw_world.workspace = true
# Script AI pushes onto the actors' directive stacks and the AI reads (`script_ai`, MA2c2); already
# in the graph through `mw_scripts_bevy` -> `mw_player_bevy`.
mw_walkers_bevy.workspace = true
# Overlay `stats` blobs (`stats`).
postcard.workspace = true
serde.workspace = true
# The dialogue partner's tier pin (`dialogue::pin`, MA20b); already in the graph through
# `mw_walkers_bevy`.
sf_ai.workspace = true
sf_ai_bevy.workspace = true
# The content's calendar the `MWScript` date globals follow (`services::sync_clock`).
sf_calendar = { workspace = true, features = ["bevy"] }
sf_character_bevy = { workspace = true, features = ["world"] }
# Magic effects on the characters (`effects`).
sf_effects_bevy.workspace = true
sf_physics_bevy.workspace = true
sf_records.workspace = true
sf_rpg.workspace = true
sf_rpg_ui.workspace = true
sf_script_bevy.workspace = true
sf_sky_bevy.workspace = true
sf_stats_bevy.workspace = true
sf_ui.workspace = true
sf_ui_bevy.workspace = true
sf_ui_inventory.workspace = true
sf_ui_screens.workspace = true
sf_world.workspace = true
sf_world_bevy.workspace = true
tes3 = { workspace = true, features = ["esp"] }
workspace-hack.workspace = true

[dev-dependencies]
# The effects glue's headless test (fixed tick).
bevy_time = { workspace = true, features = ["std"] }
# The moved tests: the RPG state round trip and the installed game's records.
mw_install.workspace = true
mw_vfs.workspace = true
# The dialogue pin's headless test: actors the allocator sees (a `Mover` at a `WorldPos`).
sf_controller_bevy.workspace = true
sf_coords.workspace = true
sf_vfs.workspace = true

[lints]
workspace = true
