mw_controls_bevy.workspace = true
mw_game_core.workspace = true
mw_records.workspace = true
mw_rpg.workspace = true
mw_script.workspace = true
mw_scripts_bevy.workspace = true
mw_world.workspace = true
serde.workspace = true
sf_character_bevy = { workspace = true, features = ["world"] }
sf_physics_bevy.workspace = true
sf_records.workspace = true
sf_rpg.workspace = true
sf_rpg_ui.workspace = true
sf_script_bevy.workspace = true
sf_ui.workspace = true
sf_ui_bevy.workspace = true
sf_ui_inventory.workspace = true
sf_ui_screens.workspace = true
sf_world.workspace = true
