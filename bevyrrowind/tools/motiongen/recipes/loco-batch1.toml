# Locomotion batch 1 (B3b, ROADMAP 3.4c, 2026-11-12): the modern preset's generated free-movement set, one style.
# Clip list and targets: superfargoth/docs/research/animation/16-gait-card-2026-11-12.md section 3.1 (walk 1.6, run 4.5,
# sprint 7.0 m/s = sf_action::GaitTable). Output "animation packs/generated/loco1/" (BYO, never committed). Format:
# bevyrrowind/docs/specs/motion-generation.md, "Recipes (MG1)". Rules from the owner's gen2 verdict (combat-gen2.toml):
# short plain prompts in Kimodo's style, no body description, 2-3 phrasings per clip, many samples, the owner picks.
# Left and straight only: the right side comes from the graph's Mirror node. Canonical space: start at XZ (0, 0) facing
# +Z, left on +X; root paths are pelvis XZ (meters @ seconds) and set the speed and the turn direction.
# Dropped from the card: start_pose chains (idle pose in, cycle frame for stops; MG1 rejects start_pose), the long prompt
# tail (owner: plain prompts), the first foot (not controllable: pick or mirror). Loops are not seamless: cycles are long
# takes and the bake cuts a same-foot window. Starts/stops/pivots run longer than the card's lengths (stand-still lead
# and gait tail for the blend; the bake trims). *.free = the same prompt without a root path (speed control).

