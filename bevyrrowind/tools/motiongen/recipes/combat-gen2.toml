# Gen2 (2026-11-05): the number-game round after the owner's MG-C0 verdict ("prompts describe the movement too much and
# ambiguously; try simpler prompts; generate a lot, pick the best"). Output: "animation packs/generated/gen2/" (BYO,
# never committed). Format: bevyrrowind/docs/specs/motion-generation.md, "Recipes (MG1)".
# Rules: one short plain action per prompt in Kimodo's own style ("A person ..."), one weapon style word per prompt, no
# step-by-step body description, no ambiguous verbs ("climb up"); 2-3 phrasings per traversal move. Constraints: none
# (no hand keys: they hurt), except an end pelvis height on mantles so the model ends standing on the ledge top
# (ledge 1 m -> pelvis 2.0, ledge 2 m -> 3.0). Ids group the browser pages: atk.<context>.<weapon>.<n>, trav.*, dodge.*.

