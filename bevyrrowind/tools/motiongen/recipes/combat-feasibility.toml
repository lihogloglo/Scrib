id = "jump.standing"
point = "ground"
phases = ["act"]
variants = 4
duration = 2.0
prompt = "A person bends their knees and jumps forward with both feet, lands softly and stands up straight."
constraints.act = { root = "path:0,0@0;0,0@0.5;0,1.0@1.2;0,1.0@2.0", pelvis_height = [{ height = 1.0, at = [0.0] }, { height = 1.45, at = [0.85] }, { height = 1.0, at = [2.0] }] }

[[activity]]
id = "jump.running"
point = "ground"
