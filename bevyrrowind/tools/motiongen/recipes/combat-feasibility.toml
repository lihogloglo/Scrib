# SPDX-License-Identifier: GPL-3.0-or-later
# MG-C0 feasibility run (bevyrrowind/docs/research/combat-anim-generation-2026-11-05.md, "Slice plan"): can Kimodo make
# sword swings, rolls, jumps, mantles and vaults? Output: "animation packs/generated/mg-c0/" (BYO, never committed).
# Format: bevyrrowind/docs/specs/motion-generation.md, "Recipes (MG1)". Canonical space: meters, Y up, the actor starts
# at XZ (0, 0) facing +Z, left hand on +X (so the right hand is side > 0 -> -X). Hand targets are global (the root is
# keyed at the hand frames: the origin, or the root path there). SOMA actor: pelvis 1.00 m standing, ankle 0.07 m.
# Prompts are plain body motion ("A person..."), one or two behaviours (Kimodo best practices); "videogame combat" is
# in its training data, so the swings name the sword. The *.free ids are the same swings without constraints (control).

# --- One-handed sword, right hand: light chain pieces ------------------------------------------------------------

[[activity]]
id = "sword.light.diag_rl"
point = "ground"
props = ["sword"]
phases = ["act"]
variants = 4
duration = 2.0
prompt = "A person holding a sword in their right hand raises it above their right shoulder and slashes diagonally down across their body to the left, then returns to a fighting stance."
constraints.act = { hand_r = [{ height = 1.75, side = 0.45, forward = 0.15, at = [0.45] }, { height = 0.85, side = -0.35, forward = 0.45, at = [0.85] }] }

[[activity]]
id = "sword.light.diag_lr"
point = "ground"
props = ["sword"]
phases = ["act"]
variants = 4
duration = 2.0
prompt = "A person holding a sword in their right hand, with the arm across the body at the left hip, slashes up and outward to the right in a backhand swing, then returns to a fighting stance."
constraints.act = { hand_r = [{ height = 1.0, side = -0.3, forward = 0.3, at = [0.4] }, { height = 1.45, side = 0.6, forward = 0.35, at = [0.8] }] }

[[activity]]
id = "sword.light.horizontal"
point = "ground"
props = ["sword"]
phases = ["act"]
variants = 4
duration = 2.0
prompt = "A person holding a sword in their right hand swings it horizontally from right to left at chest height, turning their torso, then returns to a fighting stance."
constraints.act = { hand_r = [{ height = 1.35, side = 0.6, forward = 0.0, at = [0.45] }, { height = 1.3, side = -0.5, forward = 0.45, at = [0.8] }] }

[[activity]]
id = "sword.light.overhead"
point = "ground"
props = ["sword"]
phases = ["act"]
variants = 4
duration = 2.5
prompt = "A person holding a sword in their right hand steps forward, raises it high above their head and brings it straight down hard in front of them, then recovers to a fighting stance."
constraints.act = { root = "path:0,0@0;0,0@0.4;0,0.45@1.1;0,0.45@2.4", hand_r = [{ height = 2.05, side = 0.15, forward = 0.1, at = [0.6] }, { height = 0.8, side = 0.05, forward = 1.1, at = [1.0] }] }

