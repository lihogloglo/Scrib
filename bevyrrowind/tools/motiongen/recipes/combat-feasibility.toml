constraints.act = { root = "path:0,0@0;0,3.0@0.9;0,6.0@1.6;0,10.0@3.0", pelvis_height = [{ height = 1.4, at = [1.25] }] }

# --- Mantles (ledge front face at +Z, hands on the top 0.1 m past the edge) --------------------------------------

[[activity]]
id = "mantle.ledge_1m"
point = "ground"
phases = ["act"]
variants = 4
duration = 3.5
prompt = "A person walks up to a waist-high wall, places both hands on top of it, pushes up and climbs onto it, then stands up on top."
constraints.act = { root = "path:0,0@0;0,0.3@0.8;0,0.35@1.4;0,1.0@2.4;0,1.2@3.5", hand_l = { height = 1.03, side = 0.25, forward = 0.8, at = [1.0, 1.4] }, hand_r = { height = 1.03, side = 0.25, forward = 0.8, at = [1.0, 1.4] }, pelvis_height = [{ height = 1.0, at = [0.0] }, { height = 2.0, at = [3.4] }] }

[[activity]]
id = "mantle.ledge_2m"
point = "ground"
phases = ["act"]
variants = 4
duration = 4.0
prompt = "A person jumps up to grab the top of a high wall with both hands, pulls themselves up, climbs over the edge and stands up on top."
constraints.act = { root = "path:0,0@0;0,0.15@0.5;0,0.2@1.4;0,0.9@3.2;0,1.0@4.0", hand_l = { height = 2.03, side = 0.25, forward = 0.55, at = [0.9, 1.4] }, hand_r = { height = 2.03, side = 0.25, forward = 0.55, at = [0.9, 1.4] }, pelvis_height = [{ height = 1.0, at = [0.0] }, { height = 1.35, at = [1.4] }, { height = 3.0, at = [3.9] }] }

# --- Vaults (1 m obstacle, top at y = 1.0) -----------------------------------------------------------------------

[[activity]]
id = "vault.run_one_hand"
point = "ground"
phases = ["act"]
variants = 4
duration = 2.5
prompt = "A person runs forward, puts their left hand on top of a waist-high wall and vaults over it, landing on the other side and continuing to run."
constraints.act = { root = "path:0,0@0;0,2.4@0.8;0,3.0@1.05;0,4.0@1.4;0,7.0@2.5", hand_l = { height = 1.03, side = 0.15, forward = 3.0, at = [0.95] }, pelvis_height = [{ height = 1.3, at = [1.05] }] }

[[activity]]
id = "vault.walk_two_hand"
point = "ground"
phases = ["act"]
variants = 4
duration = 3.0
prompt = "A person walks up to a waist-high wall, puts both hands on top of it and swings their legs over it, landing on the other side."
constraints.act = { root = "path:0,0@0;0,0.5@1.0;0,1.0@1.6;0,1.8@2.4;0,2.2@3.0", hand_l = { height = 1.03, side = 0.2, forward = 1.0, at = [1.3, 1.6] }, hand_r = { height = 1.03, side = 0.2, forward = 1.0, at = [1.3, 1.6] }, pelvis_height = [{ height = 1.0, at = [0.0] }, { height = 1.3, at = [1.6] }] }
