# --- Rolls -------------------------------------------------------------------------------------------------------

[[activity]]
id = "roll.forward"
point = "ground"
phases = ["act"]
variants = 4
duration = 2.0
prompt = "A person takes a quick step, dives into a forward roll over their shoulder on the ground and comes back up to standing."
constraints.act = { root = "path:0,0@0;0,1.0@0.5;0,2.4@1.2;0,3.0@2.0", pelvis_height = [{ height = 1.0, at = [0.0] }, { height = 0.45, at = [0.85] }, { height = 0.95, at = [2.0] }] }

[[activity]]
id = "roll.side"
point = "ground"
phases = ["act"]
variants = 4
duration = 2.0
prompt = "A person in a fighting stance quickly rolls sideways to their right on the ground and gets back up into a fighting stance."
constraints.act = { root = "path:0,0@0;-0.6,0@0.4;-1.6,0@1.0;-2.0,0@1.8", pelvis_height = [{ height = 1.0, at = [0.0] }, { height = 0.45, at = [0.7] }, { height = 0.95, at = [2.0] }] }

# --- Jumps -------------------------------------------------------------------------------------------------------

