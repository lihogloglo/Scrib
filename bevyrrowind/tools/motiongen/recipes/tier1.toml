# SPDX-License-Identifier: GPL-3.0-or-later
# Tier 1-2 ambient activities (MG2), rows from bevyrrowind/docs/research/ambient-catalog-2026-10-28.md, section 3.
# Format: bevyrrowind/docs/specs/motion-generation.md, "Recipes (MG1)". Heights in meters (SOMA space for offsets);
# "band.seat+0.10" = seat band height plus 0.10 m (hip joint above the seat surface).
# Canonical space: actor starts at XZ (0, 0) facing +Z; furniture/wall sits behind (-Z) unless the prompt says otherwise.
# Each loop prompt starts in the end pose of its enter prompt; each exit prompt starts in the loop pose.
# Ids must not collide with seed.toml (sit.chair.idle, sweep.broom, lean.wall.arms_crossed).

# --- Seated: chair -------------------------------------------------------------------------------------------------

[[activity]]
id = "sit.chair.rest"
point = "seat"
props = []
phases = ["enter", "loop", "exit"]
variants = 4
duration = { enter = 3.0, loop = 8.0, exit = 3.0 }
prompt.enter = "A person standing with their back to a chair bends their knees and sits down on it, resting their hands on their thighs."
prompt.loop = "A person sitting on a chair with hands on their thighs rests idly, shifting their weight, glancing around and scratching their arm."
prompt.exit = "A person sitting on a chair leans forward, pushes on their thighs and stands up."
constraints.enter = { pelvis_height = { height = "band.seat+0.10", at = "end" }, root = "fixed_xz" }
constraints.loop = { pelvis_height = "band.seat+0.10", root = "fixed" }
constraints.exit = { pelvis_height = { height = "band.seat+0.10", at = "start" }, root = "fixed_xz" }

[[activity]]
id = "sit.chair.talk"
point = "seat"
props = []
phases = ["loop"]
variants = 4
duration = 8.0
prompt = "A person sitting on a chair talks to someone in front of them, nodding and gesturing with one hand."
constraints.loop = { pelvis_height = "band.seat+0.10", root = "fixed" }

[[activity]]
id = "sit.chair.drink"
point = "seat"
props = ["tankard"]
phases = ["loop"]
variants = 4
duration = 8.0
prompt = "A person sitting on a chair raises a mug in their right hand, drinks from it, then lowers it to rest on their knee."
constraints.loop = { pelvis_height = "band.seat+0.10", root = "fixed" }

[[activity]]
id = "sit.chair.read"
point = "seat"
props = ["book"]
phases = ["loop"]
variants = 4
duration = 8.0
prompt = "A person sitting on a chair holds an open book in both hands on their lap, reads it and slowly turns a page."
constraints.loop = { pelvis_height = "band.seat+0.10", root = "fixed" }

