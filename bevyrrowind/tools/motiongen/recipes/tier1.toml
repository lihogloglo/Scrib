# --- Leaning -------------------------------------------------------------------------------------------------------

[[activity]]
id = "lean.wall.relaxed"
point = "wall"
props = []
phases = ["enter", "loop", "exit"]
variants = 4
duration = { enter = 3.0, loop = 8.0, exit = 2.5 }
prompt.enter = "A person steps back and leans their back and shoulders against a wall, hands in front of their hips."
prompt.loop = "A person leaning back against a wall rests one foot flat against it, looks around and shifts their weight."
prompt.exit = "A person leaning back against a wall pushes off it with their shoulders and stands upright."
constraints.loop = { root = "fixed" }

[[activity]]
id = "lean.counter.idle"
point = "counter"
props = []
phases = ["enter", "loop", "exit"]
variants = 4
duration = { enter = 3.0, loop = 8.0, exit = 2.5 }
prompt.enter = "A person standing in front of a counter leans forward and places both hands flat on its top."
prompt.loop = "A person leaning forward with both hands on a counter waits, tapping their fingers and looking left and right."
prompt.exit = "A person leaning on a counter pushes back with their hands and stands upright."
constraints.enter = { hand_l = { height = "band.counter", forward = 0.4, side = 0.25, at = "end" }, hand_r = { height = "band.counter", forward = 0.4, side = 0.25, at = "end" } }
constraints.loop = { root = "fixed", hand_l = { height = "band.counter", forward = 0.4, side = 0.25 }, hand_r = { height = "band.counter", forward = 0.4, side = 0.25 } }
constraints.exit = { hand_l = { height = "band.counter", forward = 0.4, side = 0.25, at = "start" }, hand_r = { height = "band.counter", forward = 0.4, side = 0.25, at = "start" } }

